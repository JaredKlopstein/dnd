    if (v === "hint") {
      hinted = true; const r = await skillCheck("investigation", 10, { sub: "Look for clues around the door." });
      if (r.success) await narr(`The floor in front of the door is covered in muddy prints going back and forth, back and forth. Somebody has stood here guessing a <i>lot</i>.`);
      else await narr(`You find a goblin doodle of a cheese with a crown on it. Not helpful. Kind of cute.`);
      continue;
    }
    if (v === "pip") { await npc("Pip", `"Is it... cheese? It's always cheese." The door does not open.`); tries++; }
    else {
      const a = inp.value.trim().toLowerCase();
      if (/foot ?steps?|foot ?prints?|^steps?$|tracks/.test(a)) {
        inp.disabled = true; badge("riddle"); sfx("good");
        await narr(`"${esc(inp.value.trim())}," you say. The door grinds open with a sound like a disappointed sigh.`);
        await tip("Well done", `Clever players are rewarded too. That one was all you, not your dice.`);
        return;
      }
      tries++; you(a ? `“${esc(inp.value.trim())}”` : "(mumbles)"); await narr(`Nothing happens.`);
      inp.value = "";
    }
    if (tries >= 3) {
      inp.disabled = true;
      await narr(`After your third guess the door clicks and swings open anyway. Of course: goblins can never remember the answer either, so they rigged it to open on the third try.`);
      await tip("The answer", `It was <b>footsteps</b>. Good DMs don't let a puzzle stall the whole game. There's usually another way through.`);
      return;
    }
  }
}

async function chBoss() {
  scene(`Chapter 7 of ${TOTAL_CH}`, "The Cheese Throne");
  await narr(`The tunnel opens into a cavern lit by a crackling fire. On a ledge sits the <b>Great Wheel of Brindlewood</b>, golden and enormous. Sprawled on top of it like a throne is a goblin in a dented crown: <b>Boss Snaggletooth</b>.`);
  await npc("Snaggletooth", `"Who dares disturb my snack? Grub! Get them!"`);
  await narr(`A burly goblin named Grub grunts and draws a scimitar.`);
  await tip("Boss fight", `<p>This fight uses everything you've learned. A few new things to watch for:</p><p><b>Multiattack:</b> Snaggletooth attacks twice per turn (the second with disadvantage). <b>Monster reactions:</b> he has a dirty trick. <b>Creativity:</b> look for an unusual action. <b>Talking:</b> once he's bloodied, he might surrender.</p>`);
  await combat({
    creative: true, parley: true,
    enemies: [
      { name: "Snaggletooth", weapon: "scimitar", ac: 15, hp: 21, atk: 4, dmg: "1d6", dmgMod: 2, dmgType: "slashing", dist: 40, speed: 30, dexMod: 2, xp: 200, boss: true, multi: 2, redirect: true, weakSide: !!S.flags.weak },
      { name: "Grub", weapon: "scimitar", ac: 15, hp: 7, atk: 4, dmg: "1d6", dmgMod: 2, dmgType: "slashing", dist: 25, speed: 30, dexMod: 2, xp: 50 }
    ]
  });
  await gainXP(250, "Snaggletooth and Grub overcome");
  badge("hero");
  await narr(`You roll the Great Wheel out of the mine together. It's surprisingly cooperative, for a cheese. Under Snaggletooth's throne you find a pouch of <b>30 gold</b> and another <b>Potion of Healing</b>.`);
  S.gold += 30; S.potions++; hud();
  await cont("Return to Brindlewood");
}

async function chEnd() {
  scene("Epilogue", "Level Up!");
  await narr(`Brindlewood's Harvest Festival goes ahead. Lanterns hang from every roof. The mayor pays you ${S.flags.reward || 50} gold, Mirna won't let you pay for a drink ever again, and Old Brunhild insists on a rematch.`);
  S.gold += (S.flags.reward || 50); hud();
  await narr(`The first slice of the Great Wheel is ceremonially given to you. It tastes like sunshine and victory.`);
  await tip("You have " + S.xp + " XP", `That's past 300, which means you reach <b>level 2</b>! Leveling up is one of the best feelings in D&D.`);
  sfx("level");
  const c = C();
  const avg = c.hd / 2 + 1;
  const v = await choose([
    { label: `Roll your Hit Die`, tag: `d${c.hd} ${fmt(abilMod("con"))}`, sub: "Risky. Could be great, could be a 1.", value: "roll" },
    { label: `Take the average`, tag: `${avg} ${fmt(abilMod("con"))}`, sub: "The safe choice most players make.", value: "avg" }
  ], { prompt: "Increase your maximum HP" });
  let gain;
  if (v === "roll") { const r = await roll({ kind: "heal", title: "Level-up HP", dice: `1d${c.hd}`, mods: [{ label: "CON", val: abilMod("con") }], player: true }); gain = r.total; }
  else gain = avg + abilMod("con");
  if (S.species === "dwarf") gain += 1;
  gain = Math.max(1, gain);
  S.level = 2; S.maxHp += gain; S.hp = S.maxHp; S.hitDice = 2; S.slots = S.maxSlots;
  const feats = {
    fighter: ["<b>Action Surge:</b> once per rest, take one extra action on your turn. Two attacks in one turn!", "<b>Tactical Mind</b> (2024): spend Second Wind to boost a failed ability check."],
    rogue: ["<b>Cunning Action:</b> Dash, Disengage, or Hide as a bonus action. Rogues become slippery."],
    wizard: ["<b>A third spell slot</b> and two new spells for your spellbook.", "<b>Scholar</b> (2024): expertise in one knowledge skill."],
    cleric: ["<b>Channel Divinity:</b> call on your god for a burst of power, like turning undead.", "<b>A third spell slot.</b>"]
  }[S.cls];
  if (S.cls === "wizard" || S.cls === "cleric") { S.maxSlots = 3; S.slots = 3; }
  S.feats = feats;
  hud();
  sys(`<b>Level 2!</b> Max HP +${gain} (now ${S.maxHp}). Hit Dice: 2.`, "good");
  add(`<ul class="sh-feat">${feats.map(f => `<li>${f}</li>`).join("")}</ul>`, "widget");
  await tip("Proficiency bonus", `Your proficiency bonus stays +2 until level 5. Then it becomes +3, and your class gets something big (like a second attack, or the Fireball spell).`);
  learn("etiquette", "conditions");
  if (S.quiz.right === S.quiz.total) badge("scholar");
  save();
  await cont("See your report card");
  await finale();
}
async function finale() {
  scene("You're ready", "Your First Real Session");
  await tip("Congratulations!", `<p>You've done almost everything a new player does at a real table. Here's a cheat sheet to bring with you.</p>`);
  add(`<div class="cheat">
    <div><h4>The one formula</h4><ul><li><b>d20 + modifier (+ proficiency)</b> vs a target</li><li>Checks and saves vs <b>DC</b>; attacks vs <b>AC</b></li><li>Meet or beat it to succeed</li></ul></div>
    <div><h4>Your turn</h4><ul><li><b>Move</b> up to your speed</li><li><b>One action</b>: Attack, Cast, Dash, Dodge, Help, Hide...</li><li><b>Bonus action</b> only if something grants one</li><li><b>One reaction</b> per round</li></ul></div>
    <div><h4>What to bring</h4><ul><li>A set of dice (or a dice app)</li><li>Pencil and eraser</li><li>Your character sheet</li><li>Snacks to share. This rule is not in the book but it is real.</li></ul></div>
    <div><h4>Phrases that help</h4><ul><li>"Can I make a Perception check?"</li><li>"What do I see?"</li><li>"I'd like to try something..."</li><li>"How does that rule work again?"</li></ul></div>
    <div><h4>Good table habits</h4><ul><li>Plan your turn while others take theirs</li><li>Share the spotlight</li><li>Say yes to other players' ideas</li><li>Ask about a <b>Session Zero</b></li></ul></div>
    <div><h4>Don't worry about</h4><ul><li>Memorizing every rule</li><li>Optimizing your character</li><li>Doing it "right". Asking the DM is always right.</li></ul></div>
  </div>`, "widget");
  const b = Object.entries(BADGES).map(([k, [n, d]]) => `<div class="badge ${S.badges.includes(k) ? "" : "locked"}"><b>${S.badges.includes(k) ? n : "Locked"}</b>${S.badges.includes(k) ? d : "Play again to find it."}</div>`).join("");
  add(`<div class="lbl" style="margin-bottom:8px">Achievements · ${S.badges.length}/${Object.keys(BADGES).length}</div><div class="badges">${b}</div>`, "widget");
  sys(`Rulebook pages discovered: <b>${S.lore.length}/${CODEX.length}</b> · Quiz score: <b>${S.quiz.right}/${S.quiz.total}</b> · Gold: <b>${S.gold}</b> · Level <b>${S.level}</b>`);
  await tip("Next steps", `<p>The free <b>Basic Rules</b> on D&D Beyond cover everything here and more. Starter sets are a great first adventure for a new group. And now you're ready to sit down at a table.</p><p>Good luck, ${esc(S.name)}. May your d20s roll high.</p>`);
  while (true) {
    const v = await choose([
      { label: "Open the Rulebook", value: "codex" },
      { label: "Play again with a new character", value: "again", cls: "primary" }
    ]);
    if (v === "codex") { renderCodex(); openDrawer("#codexDrawer"); }
    else { const keep = { lore: S.lore, badges: S.badges }; S = freshState(); S.lore = keep.lore; S.badges = keep.badges; S.flags = {}; S.chapter = 1; save(); hud(); return run(1); }
  }
}

/* =========================================================
   Title & run loop
   ========================================================= */
const CHAPTERS = [null, chTable, chCreate, chTavern, chWoods, chAmbush, chCave, chBoss, chEnd];
async function run(from) {
  for (let i = from; i < CHAPTERS.length; i++) {
    S.chapter = i; save(); hud();
    await CHAPTERS[i]();
  }
}
async function title() {
  $("#chapterTag").textContent = ""; $("#sceneTitle").textContent = "";
  logEl.innerHTML = ""; boardEl.innerHTML = "";
  const saved = loadSave();
  add(`<div class="title-screen">${TWENTY}<h1 class="big-title">Dicebound</h1><p class="tagline">A playable crash course in Dungeons &amp; Dragons. Learn the real 5th Edition rules by living them.</p>
    <div class="feature-list"><div><b>Build a hero</b>Species, class, background, ability scores.</div><div><b>Roll real dice</b>Checks, saves, advantage, crits.</div><div><b>Fight goblins</b>Initiative, actions, reactions, death saves.</div><div><b>Talk, sneak, solve</b>Because not everything is a fight.</div></div>
    <p class="hint" style="margin:0">About 30–45 minutes · Your progress saves at each chapter · Keys 1–9 pick choices</p></div>`, "plain");
  $("#sceneHead").hidden = true;
  const opts = [];
  if (saved && saved.chapter > 1 && saved.cls) opts.push({ label: `Continue: ${saved.chapter > TOTAL_CH ? "Epilogue" : "Chapter " + saved.chapter}`, sub: saved.name ? `${esc(saved.name)}, level ${saved.level} ${CLASSES[saved.cls].name}` : "", value: "continue", cls: "primary big" });
  opts.push({ label: saved && saved.chapter > 1 ? "Start a new adventure" : "Begin your adventure", value: "new", cls: saved && saved.chapter > 1 ? "big" : "primary big" });
  const v = await choose(opts);
  $("#sceneHead").hidden = false;
  if (v === "continue") { S = Object.assign(freshState(), saved); hud(); await run(saved.chapter); }
  else { S = freshState(); clearSave(); hud(); await run(1); }
}
hud();
try { new ResizeObserver(() => document.documentElement.style.setProperty("--hud-h", $("#hud").offsetHeight + "px")).observe($("#hud")); } catch (e) {}
title();
</script>
