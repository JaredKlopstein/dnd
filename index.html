<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dicebound</title>
<meta name="description" content="A playable crash course in Dungeons & Dragons 5th Edition.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a game table at night. Green baize felt, brass trim, one story column,
   a sticky HUD on top, choices below the log, dice rolled in a modal tray. */
:root {
  --felt: #0e1c17;
  --felt-2: #13261e;
  --panel: #19302a;
  --panel-2: #213c33;
  --line: #2f5246;
  --ink: #ede6d3;
  --ink-dim: #a7b5aa;
  --brass: #dca94a;
  --brass-deep: #8f6b26;
  --ruby: #e0594b;
  --arcane: #86b9ec;
  --life: #6cc98a;
  --f-display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --f-body: "Alegreya", Georgia, "Times New Roman", serif;
  --f-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --hud-h: 58px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--felt);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(220,169,74,.10), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 120%, rgba(0,0,0,.55), transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 18px;
  line-height: 1.6;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: .88em; background: var(--felt-2); padding: .05em .35em; border-radius: 4px; color: var(--brass); }

/* ---------- HUD ---------- */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 16px;
  background: rgba(14,28,23,.94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  font-family: var(--f-ui);
  font-size: 15px;
}
.brand { font-family: var(--f-display); font-size: 28px; color: var(--brass); line-height: 1; letter-spacing: .5px; }
.hero { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; flex: 1; min-width: 0; }
.hero-id { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.hero-id b { font-size: 16px; }
.hero-id span { color: var(--ink-dim); font-size: 13px; }
.bars { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hp { display: flex; align-items: center; gap: 8px; }
.bar { width: 110px; height: 10px; border-radius: 6px; background: var(--felt-2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--life); transition: width .4s ease, background .4s; }
.bar.low i { background: var(--ruby); }
.stat { font-variant-numeric: tabular-nums; color: var(--ink-dim); white-space: nowrap; }
.stat b { color: var(--ink); }
.stat.insp { color: var(--brass); }
.hud-btns { display: flex; gap: 6px; margin-left: auto; }
.hud-btns button {
  background: transparent; border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 11px; font-size: 14px; color: var(--ink);
}
.hud-btns button:hover { border-color: var(--brass); }
.hud-btns .count { color: var(--brass); font-variant-numeric: tabular-nums; }

/* ---------- Stage ---------- */
.stage { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 80px; }
.scene-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
.chapter-tag { font-family: var(--f-ui); text-transform: uppercase; letter-spacing: .16em; font-size: 13px; color: var(--brass); }
.scene-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(36px, 7vw, 54px); line-height: 1.05; margin: 0; text-wrap: balance; }
#log { display: flex; flex-direction: column; gap: 14px; }
.entry { animation: rise .35s ease both; min-width: 0; }
@keyframes rise { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.entry p { margin: 0; }
.entry.narr p { font-size: 19px; max-width: 65ch; }
.entry.npc { border-left: 3px solid var(--brass-deep); padding-left: 14px; max-width: 65ch; }
.entry.npc p { font-style: italic; }
.who { display: block; font-family: var(--f-ui); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--brass); margin-bottom: 2px; }
.entry.you { align-self: flex-end; max-width: 85%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px 14px 4px 14px; padding: 8px 14px; font-family: var(--f-ui); }
.entry.you .who { color: var(--arcane); }
.entry.dm {
  display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: start;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  font-family: var(--f-ui); font-size: 16.5px; line-height: 1.55;
}
.entry.dm > div { min-width: 0; }
.entry.dm .who { color: var(--brass); }
.entry.dm p + p { margin-top: 8px; }
.entry.sys { font-family: var(--f-mono); font-size: 14px; color: var(--ink-dim); padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.18); line-height: 1.7; }
.entry.sys b { color: var(--ink); }
.entry.sys.good { color: var(--life); }
.entry.sys.bad { color: var(--ruby); }
.entry.sys .good, .good-t { color: var(--life); }
.entry.sys .bad, .bad-t { color: var(--ruby); }
.entry.round { font-family: var(--f-ui); text-transform: uppercase; letter-spacing: .2em; font-size: 12px; color: var(--brass); display: flex; align-items: center; gap: 10px; }
.entry.round::before, .entry.round::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.entry.quizq { font-family: var(--f-ui); font-weight: 700; color: var(--arcane); font-size: 17px; }
.chip { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 5px; border-radius: 5px; background: var(--ink); color: var(--felt); font-weight: 600; font-size: 13px; }
.chip.n20 { background: var(--brass); }
.chip.n1 { background: var(--ruby); color: var(--ink); }
.chip.dim { opacity: .45; }

.twenty { width: 46px; height: 46px; display: block; }
.twenty .tw-body { fill: var(--brass); }
.twenty .tw-facet { fill: none; stroke: var(--brass-deep); stroke-width: 2; stroke-linejoin: round; }
.twenty .tw-eye { fill: var(--felt); }
.twenty .tw-mouth { fill: none; stroke: var(--felt); stroke-width: 3; stroke-linecap: round; }

/* Loop diagram */
.loop { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; counter-reset: step; }
.loop div { background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14.5px; }
.loop b { display: block; font-family: var(--f-display); font-size: 22px; color: var(--brass); line-height: 1.1; margin-bottom: 4px; }
.ladder { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; margin-top: 10px; text-align: center; font-size: 13px; }
.ladder span { background: var(--felt-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; }
.ladder b { display: block; font-family: var(--f-mono); font-size: 16px; color: var(--brass); }
.anatomy { font-family: var(--f-mono); font-size: 14px; background: var(--felt-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; overflow-x: auto; white-space: nowrap; }

/* ---------- Choices ---------- */
#choices { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; scroll-margin-bottom: 24px; }
.prompt { font-family: var(--f-ui); font-size: 14px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-dim); }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.choice {
  display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "key lbl tag" "key sub sub";
  column-gap: 10px; row-gap: 2px; align-items: center; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
  font-family: var(--f-ui); font-size: 16px; line-height: 1.3;
  transition: border-color .15s, background .15s, transform .1s;
}
.choice:hover:not(:disabled) { border-color: var(--brass); background: var(--panel-2); }
.choice:active:not(:disabled) { transform: translateY(1px); }
.choice:disabled { opacity: .42; cursor: not-allowed; }
.choice .key { grid-area: key; font-family: var(--f-mono); font-size: 12px; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 5px; width: 22px; height: 22px; display: grid; place-items: center; align-self: start; }
.choice .lbl { grid-area: lbl; font-weight: 500; min-width: 0; }
.choice .tag { grid-area: tag; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--brass); white-space: nowrap; }
.choice .sub { grid-area: sub; font-size: 14px; color: var(--ink-dim); }
.choice.primary { background: var(--brass); color: var(--felt); border-color: var(--brass); }
.choice.primary .key { color: var(--felt); border-color: rgba(14,28,23,.4); }
.choice.primary .sub, .choice.primary .tag { color: var(--felt); }
.choice.primary:hover:not(:disabled) { background: #e8b95d; }
.choice.end { border-style: dashed; }
.choice.big .lbl { font-family: var(--f-display); font-size: 24px; font-weight: 500; }

/* ---------- Widgets ---------- */
.widget { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-family: var(--f-ui); }
.widget .lbl { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-dim); margin-bottom: 6px; }
.name-row { display: flex; gap: 8px; flex-wrap: wrap; }
.name-row input {
  flex: 1; min-width: 0; background: var(--felt); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font: 500 18px var(--f-ui); color: var(--ink);
}
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-family: var(--f-ui); font-size: 15px; }
.btn:hover:not(:disabled) { border-color: var(--brass); }
.hint { margin: 10px 0 0; color: var(--ink-dim); font-size: 14.5px; }
.abil-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.abil {
  display: grid; grid-template-columns: 1fr auto auto; grid-template-areas: "name score mod" "desc desc desc" "flag flag flag";
  column-gap: 10px; align-items: baseline; text-align: left;
  background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.abil:hover:not(:disabled) { border-color: var(--brass); }
.abil.sel { border-color: var(--arcane); box-shadow: 0 0 0 2px rgba(134,185,236,.3); }
.ab-name { grid-area: name; font-weight: 700; }
.ab-score { grid-area: score; font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.ab-mod { grid-area: mod; font-family: var(--f-mono); color: var(--brass); font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
.ab-desc { grid-area: desc; font-size: 13.5px; color: var(--ink-dim); line-height: 1.35; margin-top: 2px; }
.ab-flag { grid-area: flag; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--brass); margin-top: 4px; }
.dice-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.die-btn { background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--f-ui); }
.die-btn:hover { border-color: var(--brass); }
.die-btn.done { border-color: var(--brass-deep); }
.die-btn .dname { font-family: var(--f-mono); font-size: 14px; color: var(--brass); }
.die-info { margin-top: 10px; min-height: 3.2em; font-size: 15.5px; }
.sheet-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.sheet-card div { background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.sheet-card small { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-dim); }
.sheet-card b { font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.sheet-card span { display: block; font-size: 13px; color: var(--ink-dim); line-height: 1.3; }

/* ---------- Dice SVG ---------- */
.die { width: 64px; height: 64px; display: block; }
.die .d-body { fill: var(--ink); stroke: var(--brass-deep); stroke-width: 3; stroke-linejoin: round; }
.die .d-facet { fill: none; stroke: rgba(143,107,38,.55); stroke-width: 2; stroke-linejoin: round; }
.die text { font-family: var(--f-mono); font-weight: 600; fill: var(--felt); text-anchor: middle; dominant-baseline: central; }
.die.red .d-body { fill: var(--ruby); }
.die.red text { fill: var(--ink); }
.die.gold .d-body { fill: var(--brass); }
.die.dim { opacity: .35; }
.die.rolling { animation: tumble .12s linear infinite; }
@keyframes tumble { 0% { transform: rotate(-14deg) scale(.96); } 50% { transform: rotate(12deg) scale(1.04); } 100% { transform: rotate(-14deg) scale(.96); } }
.die.land { animation: land .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes land { from { transform: scale(1.35); } to { transform: scale(1); } }

/* ---------- Tray ---------- */
.tray { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(5,12,10,.72); backdrop-filter: blur(3px); }
.tray-card {
  width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--brass-deep); border-radius: 16px; padding: 20px;
  box-shadow: 0 24px 60px rgba(0,0,0,.5);
  font-family: var(--f-ui); text-align: center;
  animation: rise .25s ease both;
}
.tray-kind { text-transform: uppercase; letter-spacing: .16em; font-size: 12px; color: var(--brass); }
.tray-card h2 { font-family: var(--f-display); font-weight: 500; font-size: 32px; line-height: 1.1; margin: 4px 0 6px; text-wrap: balance; }
.tray-sub { margin: 0 0 10px; color: var(--ink-dim); font-size: 15px; line-height: 1.45; }
.tray-formula { font-family: var(--f-mono); font-size: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; }
.tray-formula .term small { color: var(--ink-dim); font-size: 12px; }
.tray-formula .vs { color: var(--brass); }
.tray-dice { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0 8px; min-height: 100px; align-items: center; }
.tray-dice .die { width: 96px; height: 96px; }
.tray-dice.many .die { width: 64px; height: 64px; }
.tray-math { font-family: var(--f-mono); font-size: 17px; min-height: 1.6em; font-variant-numeric: tabular-nums; }
.tray-verdict { font-family: var(--f-display); font-size: 40px; line-height: 1.1; min-height: 1.1em; margin: 4px 0; }
.tray-verdict.good { color: var(--life); }
.tray-verdict.bad { color: var(--ruby); }
.tray-verdict.crit { color: var(--brass); text-shadow: 0 0 18px rgba(220,169,74,.6); }
.tray-note { font-size: 14.5px; color: var(--ink-dim); min-height: 0; margin: 0 0 8px; }
.tray-note:empty { display: none; }
.tray-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.tray-actions button { border-radius: 10px; padding: 12px; font-size: 17px; font-weight: 700; background: var(--panel-2); border: 1px solid var(--line); }
.tray-actions button.primary { background: var(--brass); color: var(--felt); border-color: var(--brass); }
.tray-actions button.alt { color: var(--brass); border-color: var(--brass-deep); font-weight: 500; font-size: 15px; }

/* ---------- Combat board ---------- */
#board:empty { display: none; }
#board {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hud-h)); z-index: 10;
  background: var(--felt-2); border: 1px solid var(--line); border-radius: 12px; isolation: isolate;
  padding: 10px 12px; margin-bottom: 16px; font-family: var(--f-ui); font-size: 14px;
  box-shadow: 0 10px 24px rgba(0,0,0,.35);
}
.order { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.ord { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; border-radius: 20px; border: 1px solid var(--line); background: var(--felt-2); white-space: nowrap; font-size: 13px; }
.ord .ini { font-family: var(--f-mono); font-size: 11px; background: var(--panel-2); border-radius: 12px; padding: 1px 6px; }
.ord.active { border-color: var(--brass); background: var(--panel-2); }
.ord.down { opacity: .4; text-decoration: line-through; }
.track { position: relative; height: 64px; margin: 10px 4px 2px; border-bottom: 1px dashed var(--line); }
.track .ft { position: absolute; bottom: -18px; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-dim); transform: translateX(-50%); }
.tok { position: absolute; bottom: 6px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: left .5s ease; }
.tok i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 13px; border: 2px solid var(--ink); }
.tok.you i { background: var(--arcane); color: var(--felt); }
.tok.pip i { background: var(--life); color: var(--felt); }
.tok.foe i { background: var(--ruby); color: var(--ink); }
.tok.boss i { width: 38px; height: 38px; }
.tok.down i { background: var(--panel-2); color: var(--ink-dim); border-color: var(--line); }
.tok span { font-size: 10.5px; white-space: nowrap; color: var(--ink-dim); }
.tok.lane2 { bottom: 34px; }
.foes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin-top: 24px; }
.foecard { background: var(--felt-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; display: flex; justify-content: space-between; gap: 8px; }
.foecard b { font-weight: 700; }
.foecard .st { font-size: 12.5px; }
.st.unhurt { color: var(--ink-dim); } .st.bloodied { color: var(--brass); } .st.dying { color: var(--ruby); } .st.gone { color: var(--ink-dim); }
.econ { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.pip-e { font-size: 12px; padding: 2px 9px; border-radius: 12px; border: 1px solid var(--brass-deep); color: var(--brass); }
.pip-e.used { opacity: .35; text-decoration: line-through; }
.pip-hp { font-size: 12.5px; color: var(--ink-dim); margin-left: auto; align-self: center; }

/* ---------- Drawers ---------- */
.drawer { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; background: rgba(5,12,10,.6); }
.drawer-panel {
  width: 100%; max-width: 460px; height: 100%; overflow-y: auto; background: var(--felt-2); border-left: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
  font-family: var(--f-ui); font-size: 15.5px; animation: slide .25s ease both;
}
@keyframes slide { from { transform: translateX(30px); opacity: .001; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.drawer-head h2 { font-family: var(--f-display); font-weight: 500; font-size: 34px; margin: 0; color: var(--brass); }
.x { background: transparent; border: 1px solid var(--line); border-radius: 8px; width: 36px; height: 36px; font-size: 18px; }
.codex-entry { border-top: 1px solid var(--line); padding: 10px 0; }
.codex-entry h3 { margin: 0 0 4px; font-size: 16px; color: var(--ink); }
.codex-entry p { margin: 0; color: var(--ink-dim); line-height: 1.5; }
.codex-entry.locked h3 { color: var(--ink-dim); letter-spacing: .2em; }
.codex-entry.fresh h3::after { content: " new"; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--brass); }
.sh-sec { margin-top: 16px; }
.sh-sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--brass); margin: 0 0 6px; }
.sh-abils { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.sh-abils div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: center; }
.sh-abils small { display: block; font-size: 11px; letter-spacing: .1em; color: var(--ink-dim); }
.sh-abils b { font-family: var(--f-mono); font-size: 22px; color: var(--brass); }
.sh-abils span { display: block; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-dim); }
.sh-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
.sh-list li { display: flex; justify-content: space-between; gap: 6px; font-size: 14px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.sh-list li.p { color: var(--ink); }
.sh-list li.p::before { content: "●"; color: var(--brass); font-size: 9px; margin-right: 4px; align-self: center; }
.sh-list li span:first-child { flex: 1; }
.sh-feat { margin: 0; padding-left: 18px; color: var(--ink-dim); }
.sh-feat li { margin-bottom: 4px; }
.sh-feat b { color: var(--ink); }

/* ---------- Toasts ---------- */
#toasts { position: fixed; z-index: 60; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { background: var(--panel-2); border: 1px solid var(--brass-deep); border-radius: 10px; padding: 8px 14px; font-family: var(--f-ui); font-size: 14.5px; box-shadow: 0 8px 20px rgba(0,0,0,.4); animation: rise .3s ease both; max-width: 300px; }
.toast small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--brass); }
.toast.out { opacity: 0; transition: opacity .4s; }

/* ---------- Title ---------- */
.title-screen { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding-top: 4vh; }
.title-screen .twenty { width: 110px; height: 110px; animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
.big-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(64px, 16vw, 128px); line-height: .9; margin: 0; color: var(--brass); letter-spacing: 1px; }
.tagline { font-size: 21px; max-width: 34ch; margin: 0; }
.feature-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; width: 100%; font-family: var(--f-ui); font-size: 14.5px; color: var(--ink-dim); }
.feature-list div { border-top: 1px solid var(--line); padding-top: 8px; }
.feature-list b { display: block; color: var(--ink); font-size: 15px; }
.badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.badge { background: var(--felt-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-family: var(--f-ui); font-size: 14px; }
.badge b { display: block; color: var(--brass); }
.badge.locked { opacity: .4; }
.badge.locked b { color: var(--ink-dim); }
.cheat { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.cheat div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-family: var(--f-ui); font-size: 15px; }
.cheat h4 { margin: 0 0 6px; font-family: var(--f-display); font-weight: 500; font-size: 24px; color: var(--brass); line-height: 1.1; }
.cheat ul { margin: 0; padding-left: 18px; color: var(--ink-dim); }
.cheat li { margin-bottom: 3px; }
.cheat li b { color: var(--ink); }

@media (max-width: 560px) {
  body { font-size: 17px; }
  .bar { width: 80px; }
  .brand { font-size: 24px; }
  .hud { gap: 6px 10px; padding: 6px 12px; }
  .hud.playing .brand { display: none; }
  .hud.playing .hud-btns { margin-left: 0; }
  .hero { gap: 4px 10px; }
  .hero-id { flex-direction: row; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .hud-btns button { padding: 4px 8px; font-size: 13px; }
  .bars { gap: 4px 10px; }
  .loop { grid-template-columns: 1fr; }
  .ladder { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .tray-dice .die { width: 80px; height: 80px; }
  .tray-verdict { font-size: 34px; }
  .sh-list { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

  return { chapter: 0, name: "", species: null, cls: null, bg: null, scores: null, skills: [], hp: 0, maxHp: 0, thp: 0, ac: 10,
    xp: 0, level: 1, gold: 0, slots: 0, maxSlots: 0, hitDice: 1, secondWind: 0, inspiration: false, bardic: false, potions: 0,
    pip: { hp: 12, maxHp: 12, ac: 14, heals: 2 }, lore: [], fresh: [], badges: [], quiz: { right: 0, total: 0 }, flags: {} };
}
let S = freshState();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function loadSave() { try { const v = localStorage.getItem(SAVE_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

const C = () => CLASSES[S.cls];
const abilMod = a => mod(S.scores[a]);
const isProf = sk => S.skills.includes(sk);
const skillBonus = sk => abilMod(SKILLS[sk]) + (isProf(sk) ? PB : 0);
const saveBonus = a => abilMod(a) + (C().saves.includes(a) ? PB : 0);
const spellMod = () => abilMod(C().primary);
const spellDC = () => 8 + PB + spellMod();
const passivePerception = () => 10 + skillBonus("perception");
function first(k) { if (S.flags[k]) return false; S.flags[k] = 1; return true; }

/* =========================================================
   Audio (tiny WebAudio synth, starts after first click)
   ========================================================= */
let actx = null, soundOn = true;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } } return actx; }
function tone(f, dur = .12, type = "sine", vol = .07, when = 0) {
  if (!soundOn) return; const c = audio(); if (!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .03);
}
function sfx(k) {
  if (k === "click") tone(640, .05, "triangle", .035);
  else if (k === "roll") for (let i = 0; i < 7; i++) tone(260 + Math.random() * 900, .035, "square", .025, i * .075);
  else if (k === "good") [523, 659, 784].forEach((f, i) => tone(f, .16, "triangle", .06, i * .09));
  else if (k === "bad") { tone(220, .2, "sawtooth", .035); tone(160, .3, "sawtooth", .035, .14); }
  else if (k === "crit") [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", .07, i * .08));
  else if (k === "hit") tone(120, .14, "square", .05);
  else if (k === "level") [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .26, "triangle", .06, i * .11));
  else if (k === "chime") tone(1046, .25, "sine", .05);
}

function dieSVG(s, v, cls = "") {
  const shapes = {
    4: `<polygon class="d-body" points="50,6 95,90 5,90"/>`,
    6: `<rect class="d-body" x="10" y="10" width="80" height="80" rx="13"/>`,
    8: `<polygon class="d-body" points="50,4 95,50 50,96 5,50"/><path class="d-facet" d="M5 50 22 50M78 50 95 50"/>`,
    10: `<polygon class="d-body" points="50,4 94,44 50,96 6,44"/><polyline class="d-facet" points="6,44 50,66 94,44"/><path class="d-facet" d="M50 66 50 96"/>`,
    12: `<polygon class="d-body" points="50,4 95,37 78,92 22,92 5,37"/><polygon class="d-facet" points="50,22 75,41 66,72 34,72 25,41"/>`,
    20: `<polygon class="d-body" points="50,4 92,28 92,72 50,96 8,72 8,28"/><polygon class="d-facet" points="50,20 80,71 20,71"/><path class="d-facet" d="M50 20 50 4M50 20 8 28M50 20 92 28M20 71 8 28M20 71 8 72M20 71 50 96M80 71 92 28M80 71 92 72M80 71 50 96"/>`,
    100: `<polygon class="d-body" points="50,4 94,44 50,96 6,44"/><polyline class="d-facet" points="6,44 50,66 94,44"/>`
  };
  const ty = { 4: 64, 6: 50, 8: 50, 10: 40, 12: 49, 20: 53, 100: 40 }[s];
  const txt = String(v);
  const fs = txt.length > 2 ? 20 : (s === 4 ? 26 : 28);
  return `<svg class="die ${cls}" viewBox="0 0 100 100" aria-label="d${s} showing ${txt}" role="img">${shapes[s]}<text x="50" y="${ty}" font-size="${fs}">${txt}</text></svg>`;
}

const logEl = $("#log"), choicesEl = $("#choices"), boardEl = $("#board");
function scrollToEnd() { requestAnimationFrame(() => { (choicesEl.firstChild ? choicesEl : logEl.lastChild || logEl).scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "end" }); }); }
function add(html, cls) { const d = document.createElement("div"); d.className = "entry " + cls; d.innerHTML = html; logEl.appendChild(d); scrollToEnd(); return d; }
const pace = (ms = 320) => sleep(REDUCED || fastMode ? 0 : ms);
let fastMode = location.hash === "#fast";
async function narr(t) { add(`<p>${t}</p>`, "narr"); await pace(); }
async function npc(name, t) { add(`<span class="who">${name}</span><p>${t}</p>`, "npc"); await pace(); }
async function tip(title, t) { add(`${TWENTY}<div><span class="who">Twenty · ${title}</span>${t.startsWith("<") ? t : `<p>${t}</p>`}</div>`, "dm"); await pace(420); }
function you(t) { add(`<span class="who">${esc(S.name || "You")}</span>${t}`, "you"); }
function sys(t, cls = "") { return add(t, "sys " + cls); }
function chip(n, sides = 20) { return `<span class="chip ${sides === 20 && n === 20 ? "n20" : ""} ${sides === 20 && n === 1 ? "n1" : ""}">${n}</span>`; }
function scene(tag, title) {
  $("#chapterTag").textContent = tag; $("#sceneTitle").textContent = title;
  logEl.innerHTML = ""; choicesEl.innerHTML = ""; boardEl.innerHTML = "";
  window.scrollTo({ top: 0 });
}

function choose(opts, { prompt } = {}) {
  return new Promise(res => {
    choicesEl.innerHTML = "";
    if (prompt) { const p = document.createElement("div"); p.className = "prompt"; p.innerHTML = prompt; choicesEl.appendChild(p); }
    const grid = document.createElement("div"); grid.className = "choice-grid";
    opts.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "choice" + (o.cls ? " " + o.cls : "");
      b.disabled = !!o.disabled;
      b.innerHTML = `<span class="key">${i + 1}</span><span class="lbl">${o.label}</span>${o.tag ? `<span class="tag">${o.tag}</span>` : ""}${o.sub ? `<span class="sub">${o.sub}</span>` : ""}`;
      b.onclick = () => { choicesEl.innerHTML = ""; sfx("click"); res(o.value !== undefined ? o.value : i); };
      grid.appendChild(b);
    });
    choicesEl.appendChild(grid);
    scrollToEnd();
  });
}
const cont = (label = "Continue") => choose([{ label, value: true, cls: "primary" }]);

/* =========================================================

function toast(kind, text) {
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<small>${kind}</small>${text}`;
  const box = $("#toasts"); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.classList.add("out"), 3600); setTimeout(() => t.remove(), 4100);
}
function learn(...keys) {
  keys.forEach(k => {
    if (S.lore.includes(k)) return;
    const e = CODEX.find(c => c[0] === k); if (!e) return;
    S.lore.push(k); S.fresh.push(k);
    toast("New rulebook page", e[1]); sfx("chime");
  });
  hud();
}
function badge(k) {
  if (S.badges.includes(k)) return;
  S.badges.push(k); toast("Achievement unlocked", `<b>${BADGES[k][0]}</b>`); sfx("good");
}
async function gainXP(n, why) {
  S.xp += n; sys(`<b>+${n} XP</b> · ${why} <span style="opacity:.7">(${S.xp} / 300 to reach level 2)</span>`, "good"); hud();
  if (first("xpTip")) { learn("xp"); await tip("Experience points", `You earn <b>XP</b> for overcoming challenges, and not only by fighting. Sneaking past, outwitting, or talking down a monster counts too. At <b>300 XP</b> you reach level 2. (Many groups skip XP and level up when the story hits a milestone.)`); }
}

  if (!S.cls || !S.scores) { $("#hud").classList.remove("playing"); $("#hudHero").hidden = true; $("#btnSheet").hidden = true; return; }

      <div><small>Proficiency</small><b>+${PB}</b><span>Added to things you're trained in</span></div>
      <div><small>Initiative</small><b>${fmt(abilMod("dex"))}</b><span>Your DEX modifier</span></div>
      <div><small>Speed</small><b>30</b><span>Feet per turn</span></div>

    <div class="sh-sec"><h3>Inventory</h3><ul class="sh-feat"><li>${S.gold} gold pieces</li><li>Potion of Healing ×${S.potions} (2d4 + 2 HP)</li><li>Explorer's pack, rations, rope, a very nice hat</li></ul></div>`;
}

$("#btnSheet").onclick = () => { renderSheet(); openDrawer("#sheetDrawer"); };
$("#btnCodex").onclick = () => { renderCodex(); openDrawer("#codexDrawer"); };

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Escape") { document.querySelectorAll(".drawer").forEach(d => d.hidden = true); return; }
  if (!$("#tray").hidden) {
    if (e.key === "Enter" || e.key === " ") { const b = $("#trayActions button.primary"); if (b) { e.preventDefault(); b.click(); } }
    return;
  }
  if (/^[1-9]$/.test(e.key)) { const bs = choicesEl.querySelectorAll("button.choice"); const b = bs[+e.key - 1]; if (b && !b.disabled) b.click(); }
  if (e.key === "Enter" || e.key === " ") { const bs = choicesEl.querySelectorAll("button.choice"); if (bs.length === 1 && document.activeElement === document.body) { e.preventDefault(); bs[0].click(); } }
});

/* =========================================================
   Dice tray
   ========================================================= */
function parseDice(str) { return str.split("+").map(p => { const [n, s] = p.split("d").map(Number); return { n: n || 1, s }; }); }
function trayButtons(btns) {
  return new Promise(res => {
    const box = $("#trayActions"); box.innerHTML = "";
    btns.forEach(b => {
      const el = document.createElement("button"); el.className = b.cls || ""; el.innerHTML = b.label;
      el.onclick = () => { sfx("click"); res(b.value); }; box.appendChild(el);
    });
    const p = box.querySelector(".primary"); if (p) setTimeout(() => p.focus({ preventScroll: true }), 30);
  });
}
async function animateDice(els, finals) {
  sfx("roll");
  els.forEach(e => e.classList.add("rolling"));
  const steps = REDUCED || fastMode ? 1 : 9;
  for (let i = 0; i < steps; i++) {
    els.forEach((e, j) => { const s = +e.dataset.s; e.querySelector("text").textContent = s === 100 ? rnd(100) : rnd(s); });
    await sleep(65);
  }
  els.forEach((e, j) => { e.classList.remove("rolling"); e.querySelector("text").textContent = finals[j]; e.classList.add("land"); });
}
function closeTray() { $("#tray").hidden = true; }

const D20_KINDS = ["check", "attack", "save", "death", "init", "enemysave", "contest", "free20"];
const KIND_LABEL = { check: "Ability check", attack: "Attack roll", save: "Saving throw", death: "Death saving throw", init: "Initiative", enemysave: "Enemy saving throw", contest: "Contest", damage: "Damage roll", heal: "Healing", free20: "Roll" };

async function roll(o) {
  const tray = $("#tray"); tray.hidden = false;
  const isD20 = D20_KINDS.includes(o.kind);
  const mods = o.mods || [];
  const modSum = mods.reduce((a, m) => a + m.val, 0);
  const adv = o.adv || 0;
  const lucky = isD20 && o.player && S.species === "halfling";
  $("#trayKind").textContent = KIND_LABEL[o.kind] || "Roll";
  $("#trayTitle").textContent = o.title;
  $("#traySub").innerHTML = o.sub || "";
  $("#trayMath").textContent = ""; $("#trayVerdict").textContent = ""; $("#trayVerdict").className = "tray-verdict"; $("#trayNote").innerHTML = "";

  let groups = isD20 ? [{ n: adv ? 2 : 1, s: 20 }] : parseDice(o.dice);
  if (o.crit) groups = groups.map(g => ({ ...g, n: g.n * 2 }));
  const diceLabel = isD20 ? (adv ? `2d20 <small>(${adv > 0 ? "advantage: keep higher" : "disadvantage: keep lower"})</small>` : "d20") : groups.map(g => `${g.n}d${g.s}`).join(" + ") + (o.crit ? " <small>(critical: dice doubled)</small>" : "");
  const terms = [`<span class="term">${diceLabel}</span>`].concat(mods.filter(m => m.val !== 0 || m.show).map(m => `<span class="term">${m.val < 0 ? "−" : "+"} ${Math.abs(m.val)} <small>${m.label}</small></span>`));
  if (o.target != null) terms.push(`<span class="term vs">vs ${o.targetLabel || "DC"} ${o.target}</span>`);
  $("#trayFormula").innerHTML = terms.join("");

  const sides = []; groups.forEach(g => { for (let i = 0; i < g.n; i++) sides.push(g.s); });
  const diceBox = $("#trayDice");
  diceBox.className = "tray-dice" + (sides.length > 3 ? " many" : "");
  diceBox.innerHTML = sides.map(s => dieSVG(s, "?", s === 20 ? "" : "")).join("");
  const els = [...diceBox.querySelectorAll(".die")]; els.forEach((e, i) => e.dataset.s = sides[i]);

  if (!o.auto) await trayButtons([{ label: o.rollLabel || "Roll!", cls: "primary", value: 1 }]);
  else { $("#trayActions").innerHTML = ""; await sleep(fastMode ? 0 : 450); }

  let vals = sides.map(s => rnd(s));
  await animateDice(els, vals);
  const notes = [];
  if (lucky) {
    for (let i = 0; i < vals.length; i++) if (vals[i] === 1) {
      notes.push("Halfling <b>Lucky</b>: you rolled a 1, so you reroll it.");
      await sleep(fastMode ? 0 : 450); vals[i] = rnd(20); await animateDice([els[i]], [vals[i]]);
    }
  }
  if (o.player && isD20 && first("firstroll")) badge("firstroll");

  let res = {};
  const compute = () => {
    let nat = null, total;
    if (isD20) {
      nat = adv > 0 ? Math.max(...vals) : adv < 0 ? Math.min(...vals) : vals[0];
      if (adv && vals.length === 2) { const keep = vals.indexOf(nat); els.forEach((e, i) => e.classList.toggle("dim", i !== keep)); }
      total = nat + modSum;
    } else total = vals.reduce((a, b) => a + b, 0) + modSum;
    total += (res.bardicAdd || 0);
    const r = { nat, total, vals, crit: false, success: null };
    if (o.kind === "attack") { r.crit = nat === 20; r.success = nat === 20 ? true : nat === 1 ? false : total >= o.target; }
    else if (o.kind === "contest") r.success = total > o.target ? true : total < o.target ? false : "tie";
    else if (o.target != null) r.success = total >= o.target;
    return r;
  };
  const show = r => {
    const parts = [isD20 ? String(r.nat) : vals.join(" + ")].concat(mods.filter(m => m.val !== 0 || m.show).map(m => `${m.val < 0 ? "−" : "+"} ${Math.abs(m.val)}`));
    if (res.bardicAdd) parts.push(`+ ${res.bardicAdd} (bardic)`);
    $("#trayMath").textContent = (parts.length > 1 ? parts.join(" ") + " = " : "Total ") + r.total;
    if (isD20) els.forEach((e, i) => { const v = vals[i]; e.classList.toggle("gold", v === 20); e.classList.toggle("red", v === 1); });
    const V = $("#trayVerdict"); V.className = "tray-verdict";
    let text = "";
    if (o.kind === "attack") { text = r.crit ? "Critical hit!" : r.success ? "Hit!" : "Miss"; V.classList.add(r.crit ? "crit" : r.success ? "good" : "bad"); }
    else if (o.kind === "enemysave") { text = r.success ? `${o.foeName} resists!` : `${o.foeName} fails!`; V.classList.add(r.success ? "bad" : "good"); }
    else if (o.kind === "death") { text = r.nat === 20 ? "Back on your feet!" : r.nat === 1 ? "Two failures!" : r.success ? "Success" : "Failure"; V.classList.add(r.nat === 20 ? "crit" : r.success ? "good" : "bad"); }
    else if (o.kind === "contest") { text = r.success === "tie" ? "Tie!" : r.success ? "You win!" : "You lose"; if (r.success !== "tie") V.classList.add(r.success ? "good" : "bad"); }
    else if (o.kind === "init") text = `Initiative ${r.total}`;
    else if (o.kind === "damage") { text = `${r.total} damage`; if (r.total > 0) V.classList.add("good"); }
    else if (o.kind === "heal") { text = `+${r.total} HP`; V.classList.add("good"); }
    else if (o.kind === "free20") text = String(r.total);
    else if (r.success != null) { text = r.success ? "Success" : "Failure"; V.classList.add(r.success ? "good" : "bad"); }
    V.textContent = text;
    if (isD20 && o.kind !== "enemysave") {
      if (r.nat === 20) notes.push(o.kind === "attack" ? "Natural 20! Critical hits double the damage dice." : o.kind === "check" || o.kind === "save" ? "Natural 20! Strictly by the rules it's just a high number on checks and saves, but many tables treat it as extra-awesome." : "");
      if (r.nat === 1 && o.kind === "attack") notes.push("Natural 1: an automatic miss.");
    }
    $("#trayNote").innerHTML = [...new Set(notes)].filter(Boolean).join("<br>");
  };
  res = compute(); show(res);
  if (o.player && isD20) {
    if (res.nat === 20) { sfx("crit"); badge("nat20"); }
    else if (res.nat === 1) { badge("nat1"); }
  }
  const goodForYou = o.kind === "enemysave" ? res.success === false : res.success === true;
  if (res.success === true || res.success === false) sfx(goodForYou ? (res.crit ? "crit" : "good") : "bad");

  // Offer inspiration on a failed d20 roll
  let accepted = false;
  while (o.player && isD20 && res.success === false && o.kind !== "death" && (S.inspiration || S.bardic)) {
    const btns = [];
    if (S.inspiration) btns.push({ label: "Spend Heroic Inspiration: reroll the d20", cls: "alt", value: "heroic" });
    if (S.bardic) btns.push({ label: "Add Pip's Bardic Inspiration (+1d6)", cls: "alt", value: "bardic" });
    btns.push({ label: "Accept the result", cls: "primary", value: "accept" });
    if (first("inspTip")) { learn("inspiration"); $("#trayNote").innerHTML += `<br><b>Twenty:</b> you failed, but you have Inspiration to spend. This is exactly when to use it.`; }
    const v = await trayButtons(btns);
    if (v === "accept") { accepted = true; break; }
    if (v === "heroic") {
      S.inspiration = false;
      const idx = adv ? vals.indexOf(res.nat) : 0;
      vals[idx] = rnd(20); await animateDice([els[idx]], [vals[idx]]);
      if (lucky && vals[idx] === 1) { vals[idx] = rnd(20); await animateDice([els[idx]], [vals[idx]]); }
    } else {
      S.bardic = false;
      const b = rnd(6); res.bardicAdd = (res.bardicAdd || 0) + b;
      diceBox.insertAdjacentHTML("beforeend", dieSVG(6, b, "land gold")); sfx("roll");
    }
    const keepAdd = res.bardicAdd; res = compute(); res.bardicAdd = keepAdd; show(res);
    if (res.success) sfx("good"); else sfx("bad");
    hud();
  }

  const keep = o.keepOpen || (o.keepOpenOnSuccess && res.success === true);
  const label = keep && o.hitLabel ? o.hitLabel : (o.contLabel || "Continue");
  if (!accepted) await trayButtons([{ label, cls: "primary", value: 1 }]);
  if (!keep) closeTray();
  return res;
}

async function skillCheck(sk, dc, o = {}) {
  const a = SKILLS[sk];
  const mods = [{ label: ABBR[a], val: abilMod(a), show: true }];
  if (isProf(sk)) mods.push({ label: "Proficiency", val: PB });
  const profNote = isProf(sk) ? `You're proficient in ${SKILL_NAME[sk]}, so you add your +${PB} proficiency bonus.` : `You aren't proficient in ${SKILL_NAME[sk]}, so it's just your ${ABBR[a]} modifier.`;
  return roll({ kind: "check", title: `${ABIL[a]} (${SKILL_NAME[sk]}) check`, sub: (o.sub ? o.sub + " " : "") + profNote, mods, target: dc, adv: o.adv || 0, player: true });
}
async function savingThrow(a, dc, o = {}) {
  const mods = [{ label: ABBR[a], val: abilMod(a), show: true }];
  if (C().saves.includes(a)) mods.push({ label: "Proficiency", val: PB });
  return roll({ kind: "save", title: `${ABIL[a]} saving throw`, sub: o.sub || "", mods, target: dc, adv: o.adv || 0, player: true });
}

/* =========================================================
   Healing & damage
   ========================================================= */
function damagePlayer(n) { let r = n; if (S.thp > 0) { const a = Math.min(S.thp, r); S.thp -= a; r -= a; } S.hp = Math.max(0, S.hp - r); hud(); }
function healPlayer(n) { S.hp = Math.min(S.maxHp, S.hp + n); hud(); }

/* =========================================================
   Combat
   ========================================================= */
let CB = null;
function foeStatus(f) {
  if (f.state === "fled") return ["Fled", "gone"];
  if (f.state === "surrendered") return ["Surrendered", "gone"];
  if (f.hp <= 0) return ["Defeated", "gone"];
  if (f.hp === f.maxHp) return ["Unhurt", "unhurt"];
  if (f.hp > f.maxHp / 2) return ["Wounded", "unhurt"];
  if (f.hp > f.maxHp / 4) return ["Bloodied", "bloodied"];
  return ["Barely standing", "dying"];
}
function renderBoard() {
  const F = CB; if (!F) { boardEl.innerHTML = ""; return; }
  const ord = F.order.map(o => {
    const name = o.t === "player" ? esc(S.name) : o.t === "pip" ? "Pip" : o.f.name;
    const down = o.t === "player" ? S.hp <= 0 : o.t === "pip" ? S.pip.hp <= 0 : o.f.state !== "up";
    return `<span class="ord ${F.active === o ? "active" : ""} ${down ? "down" : ""}"><span class="ini">${o.init}</span>${name}</span>`;
  }).join("");
  const maxD = 70; const pos = d => 6 + (Math.min(d, maxD) / maxD) * 88; const fpos = d => pos(Math.max(d, 12));
  const toks = [`<div class="tok you ${S.hp <= 0 ? "down" : ""}" style="left:${pos(0)}%"><i>${esc(S.name[0] || "Y")}</i><span>You</span></div>`];
  const pipF = F.foes.find(f => f.id === F.pipTarget && f.state === "up");
  toks.push(`<div class="tok pip lane2 ${S.pip.hp <= 0 ? "down" : ""}" style="left:${pipF ? fpos(pipF.dist) : pos(0)}%"><i>P</i></div>`);
  F.foes.forEach((f, i) => { if (f.state === "fled") return; toks.push(`<div class="tok foe ${f.boss ? "boss" : ""} ${f.state !== "up" ? "down" : ""} ${i % 2 ? "" : ""}" style="left:${fpos(f.dist) + (i % 2 ? 2 : 0)}%"><i>${f.name[0]}</i><span>${f.dist <= 5 ? "adjacent" : f.dist + " ft"}</span></div>`); });
  const ticks = [0, 30, 60].map(d => `<span class="ft" style="left:${pos(d)}%">${d} ft</span>`).join("");
  const foes = F.foes.map(f => { const [t, c] = foeStatus(f); return `<div class="foecard"><b>${f.name}</b><span class="st ${c}">${t}</span></div>`; }).join("");
  let econ = "";
  if (F.T && F.active && F.active.t === "player") {
    const T = F.T;
    econ = `<div class="econ"><span class="pip-e ${T.move <= 0 ? "used" : ""}">Move ${T.move} ft</span><span class="pip-e ${T.action ? "" : "used"}">Action</span><span class="pip-e ${T.bonus ? "" : "used"}">Bonus action</span><span class="pip-e ${F.reactionUsed ? "used" : ""}">Reaction</span><span class="pip-hp">Pip: ${S.pip.hp}/${S.pip.maxHp} HP</span></div>`;
  } else econ = `<div class="econ"><span class="pip-hp">Pip: ${S.pip.hp}/${S.pip.maxHp} HP</span></div>`;
  boardEl.innerHTML = `<div class="order" aria-label="Initiative order">${ord}</div><div class="track">${ticks}${toks.join("")}</div><div class="foes">${foes}</div>${econ}`;
}

async function combat(cfg) {
  const snapshot = JSON.stringify(S);
  let res = await runCombat(cfg);
  while (res === "defeat") {
    CB = null; renderBoard();
    await narr(`Darkness closes in. Somewhere far away, a twenty-sided die clatters across a table...`);
    await tip("Time out!", `<p>Your party has fallen. In a real game this could mean a dead character, though many DMs have the monsters capture you instead. Here, I'm rewinding to the start of the fight.</p><p>Since you're still learning, I'll give you <b>5 temporary hit points</b>: a shield of HP that soaks up damage first.</p>`);
    learn("thp");
    const flags = S.flags, lore = S.lore, badges = S.badges, quiz = S.quiz;
    S = JSON.parse(snapshot); S.flags = flags; S.lore = lore; S.badges = badges; S.quiz = quiz;
    S.thp = 5; hud();
    await cont("Try the fight again");
    res = await runCombat(cfg);
  }
  return res;
}

async function runCombat(cfg) {
  const foes = cfg.enemies.map((e, i) => ({ ...e, id: "f" + i, maxHp: e.hp, state: "up" }));
  const F = { foes, cfg, round: 1, order: [], active: null, T: null, pipTarget: null, lastTarget: null, deathS: 0, deathF: 0, stable: false, dead: false, dodge: false, shieldUp: false, reactionUsed: false, fled: false, creativeUsed: false };
  CB = F;
  renderBoard();
  if (cfg.tutorial) {
    learn("init");
    await tip("Combat begins: roll initiative", `Combat happens in turns. First, everyone rolls <b>initiative</b>: d20 + Dexterity modifier. The highest goes first. The DM rolls for the monsters.`);
  }
  const pi = await roll({ kind: "init", title: "Roll initiative!", sub: "d20 + your Dexterity modifier decides when you act.", mods: [{ label: "DEX", val: abilMod("dex"), show: true }], player: true });
  const order = [{ t: "player", init: pi.total, tb: 1 }, { t: "pip", init: rnd(20) + 3, tb: 0 }];
  foes.forEach(f => order.push({ t: "foe", f, init: rnd(20) + f.dexMod, tb: 0 }));
  order.sort((a, b) => b.init - a.init || b.tb - a.tb);
  F.order = order; renderBoard();
  sys(`Turn order: ${order.map(o => `${o.t === "player" ? "<b>You</b>" : o.t === "pip" ? "Pip" : o.f.name} (${o.init})`).join(" → ")}`);
  if (cfg.tutorial) {
    learn("monsterhp");
    await tip("Reading the board", `<p>The bar at the top shows the turn order and how far away everyone is. One round is about <b>6 seconds</b> of action.</p><p>Notice that you can't see the goblins' exact hit points. At a real table the DM describes how hurt a monster looks instead. <b>Bloodied</b> means it's at half health or less.</p>`);
  }
  while (true) {
    add(`Round ${F.round}`, "round");
    for (const o of order) {
      if (outcome(F)) return finish(F);
      F.active = o; renderBoard();
      if (o.t === "player") await playerTurn(F);
      else if (o.t === "pip") await pipTurn(F);
      else if (o.f.state === "up") await foeTurn(F, o.f);
      F.T = null; renderBoard();
    }
    if (outcome(F)) return finish(F);
    F.round++;
  }
}
function outcome(F) {
  if (F.foes.every(f => f.state !== "up")) return "victory";
  if (F.dead) return "defeat";
  if (S.hp <= 0 && S.pip.hp <= 0) return "defeat";
  return null;
}
async function finish(F) {
  const out = outcome(F);
  F.active = null; renderBoard();
  if (out === "defeat") return "defeat";
  F.shieldUp = false;
  await narr(F.foes.some(f => f.state === "surrendered") ? `The fight is over. Not every victory needs a final blow.` : `The last enemy falls. The fight is over.`);
  if (S.hp <= 0) { S.hp = 1; await npc("Pip", `"Up you get!" Pip presses a cool hand to your forehead and hums a quick healing tune. You wake with 1 hit point.`); }
  if (S.pip.hp <= 0) { S.pip.hp = 1; await narr(`You shake Pip awake. She groans, sits up, and checks that her lute survived.`); }
  hud();
  CB = null;
  boardEl.innerHTML = "";
  return "victory";
}

function playerWeapon() { return C().weapon; }
function upFoes(F) { return F.foes.filter(f => f.state === "up"); }

function turnOptions(F, T) {
  const c = C(), up = upFoes(F), adj = up.filter(f => f.dist <= 5), far = up.filter(f => f.dist > 5);
  const w = c.weapon, o = [];
  o.push({ label: `Attack with ${w.name}`, tag: "Action", sub: adj.length ? `${fmt(abilMod(w.stat) + PB)} to hit · ${w.dice}${fmt(abilMod(w.stat))} ${w.type}` : "Melee only: no enemy within 5 ft. Move first.", value: "attack", disabled: !T.action || !adj.length });
  if (c.cantrip) o.push({ label: `Cast ${c.cantrip.name}`, tag: "Action · cantrip", sub: c.cantrip.desc, value: "cantrip", disabled: !T.action });
  if (c.spell) o.push({ label: `Cast ${c.spell.name}`, tag: `Action · slot (${S.slots} left)`, sub: c.spell.desc, value: "spell", disabled: !T.action || S.slots < 1 });
  o.push({ label: "Move toward an enemy", tag: "Movement", sub: far.length ? `You have ${T.move} ft of movement left.` : "You're already next to every enemy.", value: "move", disabled: T.move <= 0 || !far.length });
  if (S.cls === "fighter") o.push({ label: "Second Wind", tag: "Bonus action", sub: `Heal 1d10 + 1. ${S.secondWind} use${S.secondWind === 1 ? "" : "s"} left.`, value: "wind", disabled: !T.bonus || S.secondWind < 1 });
  if (S.cls === "rogue") o.push({ label: "Off-hand dagger attack", tag: "Bonus action", sub: T.attacked ? "Two-weapon fighting: a second light-weapon attack, no modifier on damage." : "Only after you attack with your shortsword this turn.", value: "offhand", disabled: !T.bonus || !T.attacked || !adj.length });
  if (S.cls === "cleric") o.push({ label: "Cast Healing Word", tag: `Bonus action · slot (${S.slots} left)`, sub: "Heal yourself or Pip for 2d4 + WIS from 60 ft away.", value: "hword", disabled: !T.bonus || S.slots < 1 });
  if (S.potions > 0) o.push({ label: "Drink a Potion of Healing", tag: "Bonus action", sub: "Heal 2d4 + 2. (A bonus action in the 2024 rules; an action in 2014.)", value: "potion", disabled: !T.bonus });
  o.push({ label: "Dodge", tag: "Action", sub: "Attacks against you have disadvantage until your next turn.", value: "dodge", disabled: !T.action });
  o.push({ label: "Dash", tag: "Action", sub: "Gain 30 ft of extra movement this turn.", value: "dash", disabled: !T.action || !far.length });
  if (F.cfg.creative) o.push({ label: "Try something creative", tag: "Action", sub: "Use the room. Describe a plan, roll a check.", value: "creative", disabled: !T.action || F.creativeUsed });
  const boss = F.foes.find(f => f.boss && f.state === "up");
  if (F.cfg.parley && boss && boss.hp <= boss.maxHp / 2) o.push({ label: "Demand Snaggletooth's surrender", tag: "Action", sub: "He's bloodied and scared. Talk instead of fight.", value: "parley", disabled: !T.action });
  o.push({ label: "End turn", value: "end", cls: "end" });
  return o;
}

async function pickFoe(F, list, prompt) {
  if (list.length === 1) return list[0];
  const v = await choose(list.map(f => ({ label: f.name, sub: `${foeStatus(f)[0]} · ${f.dist <= 5 ? "next to you" : f.dist + " ft away"} · AC ${f.ac}`, value: f.id })).concat([{ label: "Back", value: "back", cls: "end" }]), { prompt });
  return v === "back" ? null : F.foes.find(f => f.id === v);
}

async function playerTurn(F) {
  F.dodge = false; F.shieldUp = false; F.reactionUsed = false; hud();
  if (S.hp <= 0) return deathSave(F);
  const T = { move: 30, action: 1, bonus: 1, attacked: false, sneakUsed: false };
  F.T = T; renderBoard();
  if (F.cfg.tutorial && first("turnTip")) {
    learn("turn", "actions");
    await tip("Your turn", `<p>On your turn you get:</p><p><b>Movement</b> up to 30 feet. <b>One action</b> (attack, cast a spell, Dodge, Dash...). <b>One bonus action</b>, only if a feature or spell says it uses one.</p><p>You can do them in any order. ${upFoes(F).some(f => f.dist <= 5) ? "A goblin is right next to you, so you can attack it with your weapon without moving." : "The nearest goblin is " + Math.min(...upFoes(F).map(f => f.dist)) + " feet away, so to hit it with a melee weapon you'll need to move first."} ${C().cantrip ? `You also have a ranged cantrip, ${C().cantrip.name}, that works from right here.` : ""}</p>`);
  }
  while (true) {
    if (outcome(F)) return;
    const opts = turnOptions(F, T);
    if (opts.filter(o => o.value !== "end").every(o => o.disabled)) { sys("You've used everything useful this turn."); await pace(300); break; }
    const v = await choose(opts, { prompt: `Your turn · ${T.move} ft movement · ${T.action ? "action ready" : "action used"} · ${T.bonus ? "bonus action ready" : "bonus action used"}` });
    if (v === "end") break;
    await doOption(F, T, v);
    renderBoard();
  }
}

async function doOption(F, T, v) {
  const c = C(), up = upFoes(F);
  if (v === "attack") {
    const t = await pickFoe(F, up.filter(f => f.dist <= 5), "Attack whom?"); if (!t) return;
    T.action = 0; T.attacked = true; renderBoard();
    await playerAttack(F, T, t, { ...c.weapon, ranged: false });
  } else if (v === "offhand") {
    const t = await pickFoe(F, up.filter(f => f.dist <= 5), "Stab whom?"); if (!t) return;
    T.bonus = 0; renderBoard();
    await playerAttack(F, T, t, { ...c.offhand, ranged: false }, { noDmgMod: true });
  } else if (v === "cantrip") {
    const t = await pickFoe(F, up, `Cast ${c.cantrip.name} at whom?`); if (!t) return;
    T.action = 0; renderBoard();
    if (first("cantripTip")) { learn("spells"); await tip("Cantrips", `A <b>cantrip</b> is a minor spell you can cast as often as you like. It doesn't use a spell slot.`); }
    if (c.cantrip.id === "firebolt") await playerAttack(F, T, t, { name: "Fire Bolt", dice: "1d10", stat: "int", type: "fire", ranged: true, spell: true });
    else await sacredFlame(F, t);
  } else if (v === "spell") {
    const t = await pickFoe(F, up, `Cast ${c.spell.name} at whom?`); if (!t) return;
    T.action = 0; S.slots--; hud(); renderBoard();
    if (first("slotTip")) { learn("spells"); await tip("Spell slots", `Leveled spells cost a <b>spell slot</b>. You have ${S.maxSlots} at level 1 and they only come back after a long rest (wizards can recover one on a short rest). Spend them when it matters.`); }
    if (c.spell.id === "missile") {
      await narr(`Three darts of blue light streak from your fingertips. Magic Missile never misses.`);
      const r = await roll({ kind: "damage", title: "Magic Missile damage", sub: "Three darts, each 1d4 + 1 force damage. No attack roll needed.", dice: "3d4", mods: [{ label: "(+1 per dart)", val: 3 }], player: true });
      await damageFoe(F, t, r.total, "force");
    } else {
      const hit = await playerAttack(F, T, t, { name: "Guiding Bolt", dice: "4d6", stat: "wis", type: "radiant", ranged: true, spell: true });
      if (hit && t.state === "up") { t.guided = true; await narr(`${t.name} glows with silvery light. The next attack against it has <b>advantage</b>.`); }
    }
  } else if (v === "move") {
    const far = up.filter(f => f.dist > 5);
    const t = await pickFoe(F, far, "Move toward whom?"); if (!t) return;
    const need = t.dist - 5; const step = Math.min(need, T.move);
    T.move -= step; t.dist -= step;
    F.foes.forEach(f => { if (f !== t && f.state === "up" && f.dist > 5) f.dist = Math.max(5, Math.abs(f.dist - step)); });
    renderBoard();
    if (t.dist <= 5) { await narr(`You close ${step} feet and stand toe-to-toe with ${t.name}.`); if (first("moveTip")) await tip("Movement", `You spent ${step} feet of your 30. You can still use your action, and you could even move again after it with whatever's left.`); }
    else await narr(`You move ${step} feet. ${t.name} is still ${t.dist} feet away. (The Dash action would give you more movement.)`);
  } else if (v === "dodge") {
    T.action = 0; F.dodge = true; await narr(`You raise your guard and focus on defense. Attacks against you have <b>disadvantage</b> until your next turn.`);
    learn("adv");
  } else if (v === "dash") {
    T.action = 0; T.move += 30; await narr(`You Dash, gaining an extra 30 feet of movement.`);
  } else if (v === "wind") {
    T.bonus = 0; S.secondWind--;
    const r = await roll({ kind: "heal", title: "Second Wind", sub: "Catch your breath and push through the pain.", dice: "1d10", mods: [{ label: "level", val: 1 }], player: true });
    healPlayer(r.total); await narr(`You grit your teeth and regain ${r.total} hit points.`);
  } else if (v === "hword") {
    const who = S.pip.hp < S.pip.maxHp && S.hp >= S.maxHp ? "pip" : await choose([{ label: "Heal yourself", sub: `${S.hp}/${S.maxHp} HP`, value: "you" }, { label: "Heal Pip", sub: `${S.pip.hp}/${S.pip.maxHp} HP`, value: "pip" }], { prompt: "Healing Word on whom?" });
    T.bonus = 0; S.slots--; hud();
    const r = await roll({ kind: "heal", title: "Healing Word", sub: "A word of divine power, spoken as a bonus action.", dice: "2d4", mods: [{ label: "WIS", val: abilMod("wis") }], player: true });
    if (who === "you") healPlayer(r.total); else { S.pip.hp = Math.min(S.pip.maxHp, S.pip.hp + r.total); }
    await narr(`Golden light knits ${who === "you" ? "your" : "Pip's"} wounds: +${r.total} HP.`);
  } else if (v === "potion") {
    T.bonus = 0; S.potions--;
    const r = await roll({ kind: "heal", title: "Potion of Healing", sub: "It tastes like cinnamon and pennies.", dice: "2d4", mods: [{ label: "potion", val: 2 }], player: true });
    healPlayer(r.total); await narr(`You gulp the red potion and regain ${r.total} hit points.`);
  } else if (v === "creative") {
    T.action = 0; F.creativeUsed = true; await creativeAction(F);
  } else if (v === "parley") {
    T.action = 0; await parley(F);
  }
}

async function playerAttack(F, T, t, w, opt = {}) {
  let pos = 0, neg = 0; const notes = [];
  if (t.guided) { pos++; notes.push("Guiding Bolt's glow gives you advantage."); }
  if (t.weakSide && !F.usedWeak) { pos++; notes.push("Nib's tip: Snaggletooth guards his left side badly. Advantage!"); }
  if (w.ranged && upFoes(F).some(f => f.dist <= 5)) { neg++; notes.push("Ranged attack with an enemy next to you: disadvantage."); }
  const adv = (pos ? 1 : 0) - (neg ? 1 : 0);
  if (pos && neg) notes.push("Advantage and disadvantage cancel out: roll one d20.");
  if (F.cfg.tutorial && first("attackTip")) {
    learn("attack");
    await tip("Attack roll", `Roll a d20 and add your attack bonus: your ${ABBR[w.stat]} modifier plus your proficiency bonus. If the total <b>meets or beats the target's Armor Class (AC)</b>, you hit. Goblins have AC 15.`);
  }
  const mods = [{ label: ABBR[w.stat], val: abilMod(w.stat), show: true }, { label: "Proficiency", val: PB }];
  const r = await roll({ kind: "attack", title: `${w.name} → ${t.name}`, sub: notes.join(" ") || (w.spell ? "A spell attack uses your spellcasting ability." : ""), mods, target: t.ac, targetLabel: "AC", adv, player: true, keepOpenOnSuccess: true, hitLabel: "Roll damage" });
  if (t.guided) t.guided = false;
  if (t.weakSide) F.usedWeak = true;
  if (!r.success) { await narr(missLine(w, t)); return false; }
  let target = t;
  if (t.redirect && !t.redirectUsed) {
    const minion = F.foes.find(f => !f.boss && f.state === "up");
    if (minion) {
      t.redirectUsed = true; closeTray();
      await narr(`Snaggletooth grabs ${minion.name} by the collar and yanks him into the way! ${minion.name} takes the hit instead.`);
      learn("reaction");
      await tip("Monsters have reactions too", `That was Snaggletooth's <b>Redirect Attack</b> reaction. Monsters follow the same action economy you do: one reaction per round. He's used his trick now.`);
      target = minion; minion.dist = t.dist;
    }
  }
  const sneakOK = S.cls === "rogue" && T && !T.sneakUsed && (adv > 0 || F.pipTarget === target.id) && adv >= 0 && !w.spell;
  let dice = w.dice; if (sneakOK) { dice += "+1d6"; T.sneakUsed = true; }
  if (F.cfg.tutorial && first("dmgTip")) {
    learn("damage");

async function foeTurn(F, f) {
  await pace(350);
  const youUp = S.hp > 0, pipUp = S.pip.hp > 0;
  if (!youUp && !pipUp) return;
  if (F.cfg.flee && !f.boss && !f.ranged && f.hp > 0 && f.hp <= 3 && f.dist <= 5 && !F.fled) { F.fled = true; return fleeEvent(F, f); }
  if (!f.ranged && f.dist > 5) {
    const step = Math.min(f.speed, f.dist - 5); f.dist -= step; renderBoard();
    await narr(f.dist <= 5 ? `${f.name} charges ${step} feet and is right in your face!` : `${f.name} advances ${step} feet.`);
    if (f.dist > 5) return;
  }
  let who = !youUp ? "pip" : !pipUp ? "you" : (f.boss || Math.random() < .65) ? "you" : "pip";
  const n = f.multi || 1;
  for (let k = 0; k < n; k++) {
    if (S.hp <= 0 && who === "you") { if (S.pip.hp > 0) who = "pip"; else break; }
    if (S.pip.hp <= 0 && who === "pip") { if (S.hp > 0) who = "you"; else break; }
    await foeAttack(F, f, who, k > 0 ? -1 : 0, k > 0);
  }
}
async function foeAttack(F, f, who, adv0, isSecond) {
  let a = adv0; if (who === "you" && F.dodge) a -= 1;
  const adv = a < 0 ? -1 : a > 0 ? 1 : 0;
  const d1 = rnd(20), d2 = rnd(20);
  const nat = adv > 0 ? Math.max(d1, d2) : adv < 0 ? Math.min(d1, d2) : d1;
  const ac = who === "you" ? myAC() : S.pip.ac;
  const total = nat + f.atk; const crit = nat === 20;
  let hit = crit || (nat !== 1 && total >= ac);
  const advTxt = adv ? ` <span style="opacity:.75">(${adv > 0 ? "advantage" : "disadvantage"}: ${d1} & ${d2}${F.dodge && who === "you" ? ", you're Dodging" : isSecond ? ", second attack" : ""})</span>` : "";
  const line = sys(`${f.name} ${isSecond ? "attacks again" : "attacks"} ${who === "you" ? "<b>you</b>" : "Pip"} with a ${f.weapon}: ${chip(nat)}${advTxt} ${fmt(f.atk)} = <b>${total}</b> vs AC ${ac} → ${crit ? '<span class="bad">CRITICAL HIT</span>' : hit ? '<span class="bad">HIT</span>' : '<span class="good">MISS</span>'}`);
  if (F.cfg.tutorial && who === "you" && first("acTip")) { learn("ac"); await tip("Armor Class at work", `Monsters roll to hit you the same way: d20 + their attack bonus against <b>your AC (${S.ac})</b>. That's why heavy armor matters.`); }
  if (hit && who === "you" && S.cls === "wizard" && S.slots > 0 && !F.reactionUsed && !crit && total < ac + 5) {
    learn("reaction");
    await tip("Reaction: Shield", `You're about to be hit, but a total of ${total} would miss AC ${ac + 5}. You can cast <b>Shield</b> as a <b>reaction</b>: +5 AC until your next turn, for one spell slot. You get one reaction per round.`);
    const c = await choose([{ label: "Cast Shield!", tag: "Reaction · 1 slot", sub: `AC becomes ${ac + 5}. The attack misses.`, value: true, cls: "primary" }, { label: "Take the hit", sub: "Save the spell slot.", value: false }]);
    if (c) { S.slots--; F.reactionUsed = true; F.shieldUp = true; hud(); renderBoard(); hit = false; line.innerHTML += ` <span class="good">→ blocked by Shield!</span>`; await narr(`A shimmering wall of force flickers into being. The blade skids off it.`); }
  }
  if (!hit) { await pace(250); return; }
  const g = parseDice(f.dmg)[0]; let dmg = f.dmgMod; const rolls = [];
  for (let i = 0; i < g.n * (crit ? 2 : 1); i++) { const x = rnd(g.s); rolls.push(x); dmg += x; }
  sfx("hit");
  if (who === "you") {
    damagePlayer(dmg);
    sys(`You take <b>${dmg}</b> ${f.dmgType} damage <span style="opacity:.7">(${rolls.join("+")} ${fmt(f.dmgMod)})</span>. HP ${S.hp}/${S.maxHp}.`, "bad");
    if (F.cfg.tutorial && first("hpTip")) { learn("hp"); await tip("Hit points", `Damage comes off your hit points. You're fine until you hit 0. Watch the HP bar at the top. Consider a heal or the Dodge action if things get dicey.`); }
    if (S.hp <= 0) {
      F.deathS = 0; F.deathF = 0; F.stable = false;
      await narr(`The blow knocks you off your feet. The world goes dark. <b>You are unconscious.</b>`);
      learn("zero", "conditions");
      await tip("0 hit points", `At 0 HP you don't die right away. You fall <b>unconscious</b>. On each of your turns you'll roll a <b>death saving throw</b>. Pip can also heal you, and any healing at all brings you back.`);
    }
  } else {
    S.pip.hp = Math.max(0, S.pip.hp - dmg);
    sys(`Pip takes <b>${dmg}</b> damage. Pip: ${S.pip.hp}/${S.pip.maxHp} HP.`, "bad");
    if (S.pip.hp <= 0) await narr(`Pip goes down with a yelp, her lute twanging sadly.`);
  }
  renderBoard(); await pace(250);
}
async function fleeEvent(F, f) {
  await narr(`${f.name}, badly hurt, shrieks and turns to run for the trees!`);
  if (S.hp > 0 && !F.reactionUsed) {
    learn("reaction");
    await tip("Reaction: opportunity attack", `When an enemy <b>leaves your reach</b>, you can use your <b>reaction</b> to make one melee attack against it. This is an <b>opportunity attack</b>. You get one reaction per round, even on someone else's turn. (Careful monsters take the Disengage action to avoid this.)`);
    const c = await choose([{ label: "Opportunity attack!", tag: "Reaction", sub: `One swing with your ${C().weapon.name} as it flees.`, value: true, cls: "primary" }, { label: "Let it go", value: false }]);

  if (f.state === "up") { f.state = "fled"; renderBoard(); await narr(`${f.name} crashes into the undergrowth and is gone. You still overcame it, and that counts.`); }

async function pipTurn(F) {
  if (S.pip.hp <= 0) { sys("Pip is unconscious."); return; }
  await pace(350);
  if (S.hp <= 0 && S.pip.heals > 0) {
    S.pip.heals--; const h = rnd(4) + 3; S.hp = h; F.deathS = F.deathF = 0; F.stable = false; hud(); renderBoard();
    await npc("Pip", `"Not on my watch!" She sings a single bright note. <b>Healing Word</b>: you regain ${h} HP and open your eyes.`);
    if (first("allyHealTip")) await tip("Teamwork saves lives", `Any healing brings a character at 0 HP back to consciousness. This is why parties love a healer, and why you should keep an eye on your friends' HP.`);
    return;
  }
  if (!S.bardic && !F.gaveBardic && S.hp > 0) {
    F.gaveBardic = true; S.bardic = true; hud();
    await npc("Pip", `"A song for courage!" Pip strums a fierce chord at you. You gain <b>Bardic Inspiration</b>: once, you can add a d6 to a failed d20 roll.`);
    if (first("bardTip")) learn("inspiration");
  }
  const up = upFoes(F); if (!up.length) return;
  const t = up.find(f => f.id === F.lastTarget) || up.slice().sort((a, b) => a.dist - b.dist)[0];
  const moved = F.pipTarget !== t.id; F.pipTarget = t.id; renderBoard();
  const nat = rnd(20), total = nat + 4, hit = nat === 20 || (nat !== 1 && total >= t.ac);
  sys(`Pip ${moved ? "darts next to " + t.name + " and stabs" : "stabs at " + t.name} with her dagger: ${chip(nat)} +4 = <b>${total}</b> vs AC ${t.ac} → ${hit ? "HIT" : "MISS"}`);
  if (S.cls === "rogue" && moved && first("pipSneakTip")) await tip("Ally adjacent", `Pip is now next to ${t.name}. That means your <b>Sneak Attack</b> works against it, even without advantage.`);
  if (hit) await damageFoe(F, t, rnd(4) + 2 + (nat === 20 ? rnd(4) : 0), "piercing");
}
async function deathSave(F) {
  if (F.stable) { sys("You are unconscious but stable."); return; }
  if (first("dsTip")) await tip("Death saving throw", `Roll a d20 with no modifiers. <b>10 or higher</b> is a success, below 10 a failure. Three successes: you stabilize. Three failures: you die. A natural 20 brings you back with 1 HP; a natural 1 counts as two failures.`);
  const r = await roll({ kind: "death", title: "Death saving throw", sub: `Successes ${"●".repeat(F.deathS)}${"○".repeat(3 - F.deathS)} · Failures ${"●".repeat(F.deathF)}${"○".repeat(3 - F.deathF)}`, mods: [], target: 10, player: true });
  if (r.nat === 20) { S.hp = 1; hud(); badge("brink"); await narr(`Your eyes snap open. You stagger up with 1 hit point!`); return; }
  if (r.nat === 1) F.deathF += 2; else if (r.success) F.deathS++; else F.deathF++;
  sys(`Death saves: ${F.deathS} success${F.deathS === 1 ? "" : "es"}, ${F.deathF} failure${F.deathF === 1 ? "" : "s"}.`);
  if (F.deathS >= 3) { F.stable = true; badge("brink"); await narr(`Your breathing steadies. You're <b>stable</b>: still unconscious, but no longer dying.`); }
  if (F.deathF >= 3) F.dead = true;
}

function finalizeCharacter(sc) {
  const c = C();
  S.scores = { ...sc }; S.scores[c.primary] += 2; S.scores.con += 1;
  const sk = [...c.skills, ...BACKGROUNDS[S.bg].skills];
  if (S.species === "elf") sk.push("perception");
  if (S.species === "human") sk.push(["persuasion", "insight", "perception", "athletics"].find(x => !sk.includes(x)));
  S.skills = [...new Set(sk)];
  S.maxHp = c.hd + abilMod("con") + (S.species === "dwarf" ? 1 : 0); S.hp = S.maxHp;
  S.ac = c.ac(S.scores);
  S.maxSlots = c.slots || 0; S.slots = S.maxSlots;
  S.secondWind = S.cls === "fighter" ? 2 : 0;

}
